version: 2
updates:
  - package-ecosystem: "docker-compose"
    directories:
      - "/services/*"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "docker"
    commit-message:
      prefix: "docker-compose"
    cooldown:
      default-days: 7